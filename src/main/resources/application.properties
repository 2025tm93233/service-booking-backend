# Server Configuration
server.port=8080
spring.application.name=service-booking-api

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=service-booking
# Or use connection string:
# spring.data.mongodb.uri=mongodb://localhost:27017/service-booking

# JWT Configuration
jwt.secret=service-booking
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.servicebooking=DEBUG
logging.level.org.springframework.web=INFO
